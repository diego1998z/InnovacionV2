server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

ai.provider=groq
explanation.provider=${EXPLANATION_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
ai.gemini.url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

ai.openai.api-key=YOUR_OPENAI_API_KEY
ai.openai.model=gpt-4o-mini
ai.openai.url=https://api.openai.com/v1/chat/completions

ai.openrouter.api-key=YOUR_OPENROUTER_API_KEY
ai.openrouter.model=meta-llama/llama-3.1-8b-instruct:free
ai.openrouter.url=https://openrouter.ai/api/v1/chat/completions

ai.groq.api-key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
ai.groq.model=llama-3.1-8b-instant
ai.groq.url=https://api.groq.com/openai/v1/chat/completions

ai.ollama.url=http://localhost:11434/api/generate
ai.ollama.model=llama3


logging.level.com.creditai=DEBUG
logging.level.org.springframework.security=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
