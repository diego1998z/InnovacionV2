server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:creditai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql

jwt.secret=creditai-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

ai.provider=groq
explanation.provider=gemini
ai.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
ai.gemini.model=gemini-2.5-flash-lite
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
ai.groq.api-key=YOUR_GROQ_API_KEY
ai.groq.model=llama-3.1-8b-instant
ai.groq.url=https://api.groq.com/openai/v1/chat/completions

logging.level.com.creditai=DEBUG
logging.level.org.springframework.security=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
